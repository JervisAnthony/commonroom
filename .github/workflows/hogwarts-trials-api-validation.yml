name: Hogwarts Trials API Validation

on:
  push:
    branches:
      - main
    paths:
      - "apps/hogwarts-trials/api/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/hogwarts-trials-api-validation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/hogwarts-trials/api/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/hogwarts-trials-api-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Hogwarts Trials API Integrity
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hogwarts_trials_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false

      - name: Configure external uv project environment
        run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/commonroom-hogwarts-trials-api-venv" >> "$GITHUB_ENV"

      - name: Verify uv version constraint
        run: |
          UV_VER=$(uv --version)
          echo "Discovered uv version: $UV_VER"
          case "$UV_VER" in
            "uv 0.12."*) ;;
            *)
              echo "Expected uv 0.12.x, got $UV_VER"
              exit 1
              ;;
          esac

      - name: Verify Python runtime pin
        run: |
          PY_VER=$(python --version)
          echo "Discovered Python version: $PY_VER"
          if [[ "$PY_VER" != "Python 3.13."* ]]; then
            echo "Expected Python 3.13.x, got $PY_VER"
            exit 1
          fi

      - name: Validate lockfile integrity
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --all-packages

      - name: Run Alembic database migrations
        env:
          HOGWARTS_TRIALS_DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/hogwarts_trials_test
        run: uv run --project apps/hogwarts-trials/api alembic -c apps/hogwarts-trials/api/alembic.ini upgrade head

      - name: Run API Tests
        env:
          HOGWARTS_TRIALS_TEST_DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/hogwarts_trials_test
        run: uv run --project apps/hogwarts-trials/api pytest apps/hogwarts-trials/api/tests

      - name: Run Repository Validation
        run: python scripts/validate_repository.py

      - name: Verify working tree clean
        run: git diff --exit-code
