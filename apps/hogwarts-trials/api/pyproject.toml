[project]
name = "hogwarts-trials-api"
version = "0.1.0"
description = "Hogwarts Trials FastAPI Backend Scaffold"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
